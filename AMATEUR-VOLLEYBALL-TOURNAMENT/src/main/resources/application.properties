spring.application.name=AMATEUR-VOLLEYBALL-TOURNAMENT

# Fun Fact: when the flag below 'spring.docker.compose.enabled' is set to true, running from intellij means starting
# automatically the docker container. And the integration does things like setting environment variables, but if you were
# to run this app from docker that would not happen, same as setting the flag to false, I think. So this is here for that.
# Just telling it to use the .env file
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/volleyball
spring.datasource.username=user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Docker Compose integration, with 'docker-compose' dependency
# Spring Boot will automatically start the database when the Java app is run.
spring.docker.compose.enabled=true

# Doesn't allow JPA to keep the database connection open as Thymeleaf draws the HTML page
spring.jpa.open-in-view=false

# Seeder custom
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.username=${ADMIN_USERNAME}
app.admin.surname=${ADMIN_SURNAME}
app.admin.role=${ADMIN_ROLE}
app.admin.isactive=${ADMIN_ISACTIVE}

# JWT secret
app.jwt.secret=${JWT_SECRET}
