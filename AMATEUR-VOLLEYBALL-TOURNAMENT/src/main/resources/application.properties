spring.application.name=AMATEUR-VOLLEYBALL-TOURNAMENT

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/volleyball
spring.datasource.username=user
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update

# Docker Compose integration, with 'docker-compose' dependency
# Spring Boot will automatically start the database when the Java app is run.
spring.docker.compose.enabled=true

# Doesn't allow JPA to keep the database connection open as Thymeleaf draws the HTML page
# It gave a warning, so I disabled it. Queries should be run in code before anyway, I think.
# Feel free to delete if necessary, like if there's a 'LazyInitializationException' (or maybe fix the code instead)
spring.jpa.open-in-view=false