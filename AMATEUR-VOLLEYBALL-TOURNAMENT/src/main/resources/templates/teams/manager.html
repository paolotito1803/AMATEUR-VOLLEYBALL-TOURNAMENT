<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Teams Manager</title>
    <!-- Bootstrap CSS for looking nice -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Volleyball Teams Dev Tools</h2>
        </div>
        <div class="card-body">

            <div class="row text-center mb-4">
                <div class="col-md-6">
                    <!-- SEED BUTTON -->
                    <button onclick="callApi('/api/teams/seed', 'POST')" class="btn btn-success btn-lg w-100">
                        Seed Teams Data
                    </button>
                    <small class="text-muted">Creates Mario and Luigi teams</small>
                </div>
                <div class="col-md-6">
                    <!-- RESET BUTTON -->
                    <button onclick="callApi('/api/teams/reset', 'DELETE')" class="btn btn-danger btn-lg w-100">
                        Reset Teams
                    </button>
                    <small class="text-muted">Deletes EVERYTHING</small>
                </div>
            </div>

            <hr>

            <!-- TEAM LIST VISUALIZATION -->
            <h4>Current Database State:</h4>
            <div th:if="${teams.empty}" class="alert alert-warning">
                Database is empty.
            </div>

            <div class="table-responsive" th:unless="${teams.empty}">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                    <tr>
                        <th>Team Name</th>
                        <th>Coach</th>
                        <th>Stadium</th>
                        <th>Players</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="team : ${teams}">
                        <td th:text="${team.name()}">Name</td>
                        <td th:text="${team.coachName()}">Coach</td>
                        <td th:text="${team.stadium() != null ? team.stadium().name() : 'No Stadium'}">Stadium</td>
                        <td>
                                <span th:each="player, iter : ${team.players()}"
                                      class="badge bg-secondary me-1">
                                    <span th:text="${player.number()} + ' - ' + ${player.name()}">Player</span>
                                </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<!-- JAVASCRIPT TO CALL API -->
<script>
    function callApi(url, method) {
        // Simple logic to disable buttons while working
        const btns = document.querySelectorAll("button");
        btns.forEach(b => b.disabled = true);

        fetch(url, {
            method: method
        })
            .then(response => {
                if (response.ok) {
                    // If successful, reload the page to see the new data
                    window.location.reload();
                } else {
                    return response.text().then(text => { throw new Error(text) });
                }
            })
            .catch(error => {
                alert("Error: " + error.message);
                btns.forEach(b => b.disabled = false);
            });
    }
</script>

</body>
</html>
