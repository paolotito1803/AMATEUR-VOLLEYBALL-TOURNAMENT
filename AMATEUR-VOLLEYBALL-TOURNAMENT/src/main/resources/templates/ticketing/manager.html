<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticket Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Volleyball Tickets tool</h2>
        </div>
        <div class="row text-center mb-4">
            <div class="col-md-6">
                <!-- SEED BUTTON -->
                <button onclick="callApi('/api/tickets/seed', 'POST')" class="btn btn-success btn-lg w-100">
                    Seed Teams Data
                </button>
                <small class="text-muted">Creates Tickets for user 1</small>
            </div>
            <div class="col-md-6">
                <!-- RESET BUTTON -->
                <button onclick="callApi('/api/tickets/reset', 'DELETE')" class="btn btn-danger btn-lg w-100">
                    Reset Tickets
                </button>
                <small class="text-muted">Deletes EVERYTHING</small>
            </div>
        </div>
        <div class="card-body">
            <!-- TICKET LIST VISUALIZATION -->
            <h4>Current Database State:</h4>
            <div th:if="${tickets.empty}" class="alert alert-warning">
                Ticket Database is empty.
            </div>

            <div class="table-responsive" th:unless="${tickets.empty}">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                    <tr>
                        <th>Seat Number</th>
                        <th>Match</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ticket: ${tickets}">
                        <td th:text="${ticket.numSeat()}">Seat Number</td>
                        <td th:text="${ticket.match()}">Match</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    function callApi(url, method) {
        // Simple logic to disable buttons while working
        const btns = document.querySelectorAll("button");
        btns.forEach(b => b.disabled = true);

        fetch(url, {
            method: method
        })
            .then(response => {
                if (response.ok) {
                    // If successful, reload the page to see the new data
                    window.location.reload();
                } else {
                    return response.text().then(text => { throw new Error(text) });
                }
            })
            .catch(error => {
                alert("Error: " + error.message);
                btns.forEach(b => b.disabled = false);
            });
    }
</script>
</body>
</html>
