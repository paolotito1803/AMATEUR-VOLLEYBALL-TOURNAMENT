<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Volleyball Tournament</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

<a href="/" class="btn btn-outline-secondary position-absolute top-0 start-0 m-3">
    <i class="bi bi-arrow-left"></i> Home
</a>

<div class="container">
    <div class="card shadow mx-auto" style="max-width: 500px;">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">New User Registration</h4>
        </div>
        <div class="card-body">

            <div id="msg-box" class="alert d-none"></div>

            <form onsubmit="handleRegister(event)">
                <!-- Username & Surname -->
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Surname</label>
                        <input type="text" id="surname" class="form-control" required>
                    </div>
                </div>

                <!-- Email & Password -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <!-- Role & Team -->
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select id="role" class="form-select" onchange="toggleTeamField()">
                        <option value="PLAYER">Player</option>
                        <option value="COACH">Coach</option>
                        <option value="REFEREE">Referee</option>
                        <option value="VIEWER">Viewer</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success w-100">Register</button>
            </form>

            <div class="mt-3 text-center">
                <a href="/users/login">Already have an account? Login</a>
            </div>
        </div>
    </div>
</div>

<script>

    async function handleRegister(event) {
        event.preventDefault();

        const dto = {
            username: document.getElementById("username").value,
            surname: document.getElementById("surname").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            role: document.getElementById("role").value
        };

        const msgBox = document.getElementById("msg-box");

        try {
            const response = await fetch('/api/users/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dto)
            });

            if (response.ok) {
                msgBox.className = "alert alert-success";
                msgBox.textContent = "Registration successful! Redirecting to login...";
                msgBox.classList.remove("d-none");
                setTimeout(() => window.location.href = '/users/login', 2000);
            } else {
                const text = await response.text();
                throw new Error(text);
            }
        } catch (error) {
            msgBox.className = "alert alert-danger";
            msgBox.textContent = "Error: " + error.message;
            msgBox.classList.remove("d-none");
        }
    }
</script>

</body>
</html>
