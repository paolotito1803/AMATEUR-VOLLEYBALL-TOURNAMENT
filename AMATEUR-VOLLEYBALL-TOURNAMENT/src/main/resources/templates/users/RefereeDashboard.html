<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Referee Console</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .match-card {
            border-left: 5px solid #ffc107;
            background-color: white;
            transition: transform 0.2s;
        }
        .match-card:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .vs-badge { font-weight: bold; background: #212529; color: white; padding: 5px 10px; border-radius: 20px; }

        .score-input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .score-input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            max-width: 150px;
        }

        .team-label {
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-size: 1rem;
            text-align: center;
        }

        .score-input {
            width: 100%;
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            padding: 0.5rem;
            border: 3px solid #dee2e6;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .score-input:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
            outline: none;
        }

        .vs-separator {
            font-size: 1.5rem;
            font-weight: 800;
            color: #6c757d;
            align-self: center;
            margin-top: 2rem;
        }

        .winner-indicator {
            margin-top: 0.5rem;
            min-height: 24px;
        }

        .winner-badge {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-light">
<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a href="/" class="btn btn-outline-secondary position-absolute top-0 start-0 m-3">
            <i class="bi bi-arrow-left"></i> Home
        </a>
        <a class="navbar-brand" href="#">⚖️ Referee Console</a>
        <div class="d-flex align-items-center gap-3">
            <span id="ref-name" class="text-white fw-bold"></span>
            <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>My Matches</h3>
        <button onclick="loadMatches()" class="btn btn-outline-primary btn-sm">🔄 Refresh</button>
    </div>

    <!-- ALERT se non ci sono partite -->
    <div id="no-matches-alert" class="alert alert-warning d-none text-center">
        No matches assigned at this moment.
    </div>

    <!-- CONTENITORE PARTITE -->
    <div id="matches-container" class="row">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Loading matches...</p>
        </div>
    </div>
</div>

<!-- MODAL INSERIMENTO PUNTEGGIO -->
<div class="modal fade" id="scoreModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title text-dark">
                    <i class="bi bi-clipboard-data me-2"></i>Enter Match Score
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="text-center mb-3">
                    <small class="text-muted">Enter the score for this match</small>
                </div>

                <div class="score-input-container">
                    <!-- Team A Score -->
                    <div class="score-input-group">
                        <div class="team-label text-primary" id="labelTeamA">Team A</div>
                        <input type="number"
                               id="scoreA"
                               class="score-input"
                               min="0"
                               max="999"
                               value="0"
                               oninput="updateWinnerIndicator()">
                        <div class="winner-indicator" id="winnerA"></div>
                    </div>

                    <!-- VS Separator -->
                    <div class="vs-separator">:</div>

                    <!-- Team B Score -->
                    <div class="score-input-group">
                        <div class="team-label text-danger" id="labelTeamB">Team B</div>
                        <input type="number"
                               id="scoreB"
                               class="score-input"
                               min="0"
                               max="999"
                               value="0"
                               oninput="updateWinnerIndicator()">
                        <div class="winner-indicator" id="winnerB"></div>
                    </div>
                </div>

                <input type="hidden" id="modalMatchId">
                <input type="hidden" id="modalNameA">
                <input type="hidden" id="modalNameB">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button onclick="submitScores()" class="btn btn-warning fw-bold">
                    <i class="bi bi-check-circle me-1"></i>Save Score
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- 1. SETUP & SICUREZZA ---
    const token = localStorage.getItem('jwt_token');
    const user = JSON.parse(localStorage.getItem('user_info'));
    const modal = new bootstrap.Modal(document.getElementById('scoreModal'));

    // Verifica Login
    if (!token || !user) {
        window.location.href = '/users/login';
    } else if (user.role !== 'REFEREE') {
        alert("Access denied. Referees only.");
        window.location.href = '/';
    } else {
        document.getElementById('ref-name').textContent = user.username;
        loadMatches();
    }

    function logout() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_info');
        window.location.href = '/';
    }

    // --- 2. CARICAMENTO DATI ---
    async function loadMatches() {
        try {
            const response = await fetch('/api/tournaments/all', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!response.ok) throw new Error("Server error");

            const tournaments = await response.json();
            const container = document.getElementById('matches-container');
            const alertBox = document.getElementById('no-matches-alert');

            container.innerHTML = '';
            alertBox.classList.add('d-none');

            let foundAny = false;
            const myUsername = user.username.trim();

            tournaments.forEach(t => {
                if (t.matches && t.matches.length > 0) {
                    const sortedMatches = t.matches.sort((a, b) => a.matchIndex - b.matchIndex);

                    sortedMatches.forEach(m => {
                        const matchRef = m.referee ? m.referee.trim() : "";
                        const isMyMatch = (matchRef === myUsername);
                        const isPlayable = (!m.winner || m.winner === "")
                            && m.teamA && m.teamB
                            && m.teamA !== 'BYE' && m.teamB !== 'BYE';

                        if (isMyMatch && isPlayable) {
                            foundAny = true;
                            renderCard(m, t.tournamentName, container);
                        }
                    });
                }
            });

            if (!foundAny) {
                alertBox.classList.remove('d-none');
            }

        } catch (error) {
            console.error(error);
            alert("Unable to load matches.");
        }
    }

    // --- 3. RENDER HTML ---
    function renderCard(match, tournamentName, container) {
        let dateDisplay = '<span class="text-muted fst-italic">Date to be determined</span>';

        if (match.matchDate) {
            const d = new Date(match.matchDate);
            if (!isNaN(d.getTime())) {
                const day = d.toLocaleDateString('en-US');
                const time = d.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
                dateDisplay = `<strong>${day}</strong> at <strong>${time}</strong>`;
            }
        }

        const stadiumDisplay = match.stadium && match.stadium !== ""
            ? `<strong>${match.stadium}</strong>`
            : '<span class="text-muted fst-italic">Stadium not assigned</span>';

        const html = `
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card shadow-sm match-card h-100">
                    <div class="card-header bg-white border-bottom-0 pt-3">
                        <small class="text-muted text-uppercase fw-bold">${tournamentName}</small>
                        <span class="float-end badge bg-light text-dark border">Match #${match.matchIndex}</span>
                    </div>

                    <div class="card-body text-center pt-0">
                        <div class="py-3">
                            <h4 class="mb-0 text-primary">${match.teamA || '???'}</h4>
                            <div class="my-2"><span class="vs-badge">VS</span></div>
                            <h4 class="mb-0 text-danger">${match.teamB || '???'}</h4>
                        </div>
                        <hr>
                        <div class="text-start small text-dark px-2">
                            <div class="mb-2">
                                <i class="bi bi-geo-alt-fill text-danger me-2"></i> ${stadiumDisplay}
                            </div>
                            <div class="mb-2">
                                <i class="bi bi-calendar-event-fill text-primary me-2"></i> ${dateDisplay}
                            </div>
                            <div class="mb-0 text-success fw-bold">
                                <i class="bi bi-person-check-fill me-2"></i> Ref: ${match.referee}
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-top-0 pb-3">
                        <button class="btn btn-warning w-100 fw-bold shadow-sm"
                                onclick="openScoreModal('${match.matchId}', '${match.teamA}', '${match.teamB}', '${match.scoreA}', '${match.scoreB}')">
                            ✏️ Enter Score
                        </button>
                    </div>
                </div>
            </div>
        `;
        container.innerHTML += html;
    }

    // --- 4. GESTIONE MODAL ---
    function openScoreModal(id, teamA, teamB, scoreA, scoreB) {
        document.getElementById('modalMatchId').value = id;
        document.getElementById('modalNameA').value = teamA;
        document.getElementById('modalNameB').value = teamB;

        document.getElementById('labelTeamA').textContent = teamA;
        document.getElementById('labelTeamB').textContent = teamB;

        // Reset scores
        document.getElementById('scoreA').value = scoreA ?? 0;
        document.getElementById('scoreB').value = scoreB ?? 0;

        updateWinnerIndicator();
        modal.show();
    }

    function updateWinnerIndicator() {
        const scoreA = parseInt(document.getElementById('scoreA').value) || 0;
        const scoreB = parseInt(document.getElementById('scoreB').value) || 0;

        const winnerADiv = document.getElementById('winnerA');
        const winnerBDiv = document.getElementById('winnerB');

        winnerADiv.innerHTML = '';
        winnerBDiv.innerHTML = '';

        if (scoreA > scoreB && scoreA > 0) {
            winnerADiv.innerHTML = '<span class="winner-badge"><i class="bi bi-trophy-fill me-1"></i>Leading</span>';
        } else if (scoreB > scoreA && scoreB > 0) {
            winnerBDiv.innerHTML = '<span class="winner-badge"><i class="bi bi-trophy-fill me-1"></i>Leading</span>';
        }
    }

    // --- 5. INVIO PUNTEGGIO ---
    async function submitScores() {
        const matchId = document.getElementById('modalMatchId').value;
        const teamA = document.getElementById('modalNameA').value;
        const teamB = document.getElementById('modalNameB').value;
        const scoreA = parseInt(document.getElementById('scoreA').value) || 0;
        const scoreB = parseInt(document.getElementById('scoreB').value) || 0;

        // Validation
        if (scoreA === 0 && scoreB === 0) {
            alert("Please enter valid scores (at least one team must score).");
            return;
        }

        if (scoreA === scoreB) {
            alert("Scores cannot be equal. There must be a winner.");
            return;
        }

        // Determine winner
        const winner = scoreA > scoreB ? teamA : teamB;

        if (!confirm(`Confirm score: ${teamA} ${scoreA} - ${scoreB} ${teamB}\nLeading: ${winner}`)) {
            return;
        }

        try {
            // 1. Update scores
            const scoresRequest = {
                matchId: matchId,
                scoreA: scoreA,
                scoreB: scoreB
            };

            const scoresResponse = await fetch('/api/tournaments/match/update_scores', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(scoresRequest)
            });

            if (!scoresResponse.ok) {
                throw new Error(await scoresResponse.text());
            }

            alert("Score saved successfully!");
            modal.hide();
            loadMatches();

        } catch (e) {
            alert("Error: " + e.message);
        }
    }
</script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

</body>
</html>
