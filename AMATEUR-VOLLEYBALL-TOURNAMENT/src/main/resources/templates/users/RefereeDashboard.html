<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Referee Console</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .match-card {
            border-left: 5px solid #ffc107; /* Giallo Arbitro */
            background-color: white;
            transition: transform 0.2s;
        }
        .match-card:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .vs-badge { font-weight: bold; background: #212529; color: white; padding: 5px 10px; border-radius: 20px; }
    </style>
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" href="#">🏐 Referee Console</a>
        <div class="d-flex align-items-center gap-3">
            <span id="ref-name" class="text-white fw-bold"></span>
            <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Le tue Partite</h3>
        <button onclick="loadMatches()" class="btn btn-outline-primary btn-sm">🔄 Aggiorna</button>
    </div>

    <!-- ALERT se non ci sono partite -->
    <div id="no-matches-alert" class="alert alert-warning d-none text-center">
        Nessuna partita assegnata a te al momento.
    </div>

    <!-- CONTENITORE PARTITE -->
    <div id="matches-container" class="row">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Caricamento calendario...</p>
        </div>
    </div>
</div>

<!-- MODAL CONFERMA RISULTATO -->
<div class="modal fade" id="resultModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title text-dark">Dichiara Vincitore</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <p class="mb-4 text-muted">Chi ha vinto l'incontro?</p>
                <div class="row g-2">
                    <div class="col-6">
                        <button onclick="submitResult('A')" class="btn btn-outline-dark w-100 py-3 h-100">
                            <h4 id="btnTeamA" class="mb-1 text-break">Team A</h4>
                            <span class="badge bg-success">Vincitore</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button onclick="submitResult('B')" class="btn btn-outline-dark w-100 py-3 h-100">
                            <h4 id="btnTeamB" class="mb-1 text-break">Team B</h4>
                            <span class="badge bg-success">Vincitore</span>
                        </button>
                    </div>
                </div>
                <input type="hidden" id="modalMatchId">
                <input type="hidden" id="modalNameA">
                <input type="hidden" id="modalNameB">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- 1. SETUP & SICUREZZA ---
    const token = localStorage.getItem('jwt_token');
    const user = JSON.parse(localStorage.getItem('user_info'));
    const modal = new bootstrap.Modal(document.getElementById('resultModal'));

    if (!token || !user) {
        window.location.href = '/users/login';
    } else if (user.role !== 'REFEREE') {
        alert("Accesso negato.");
        window.location.href = '/users/login';
    } else {
        document.getElementById('ref-name').textContent = "Ref. " + (user.surname || user.username);
        loadMatches();
    }

    function logout() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_info');
        window.location.href = '/users/login';
    }

    // --- 2. CARICAMENTO DATI ---
    async function loadMatches() {
        try {
            const response = await fetch('/api/tournaments/all', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!response.ok) throw new Error("Errore server");

            const tournaments = await response.json();
            const container = document.getElementById('matches-container');
            const alertBox = document.getElementById('no-matches-alert');

            container.innerHTML = '';
            alertBox.classList.add('d-none');

            let foundAny = false;

            // Identificativi dell'arbitro loggato
            const myUsername = user.username;
            const mySurname = user.surname;

            tournaments.forEach(t => {
                if (t.matches && t.matches.length > 0) {
                    // Ordina per matchIndex
                    const sortedMatches = t.matches.sort((a, b) => a.matchIndex - b.matchIndex);

                    sortedMatches.forEach(m => {

                        // --- FILTRO CHIAVE ---
                        // 1. La partita deve avere il campo referee uguale al mio username O cognome
                        // 2. La partita deve essere GIOCABILE (teamA e teamB presenti, non BYE)
                        // 3. La partita NON deve avere ancora un vincitore

                        // Controllo se sono io l'arbitro (case insensitive per sicurezza)
                        const isMyMatch = (m.referee && (m.referee === myUsername || m.referee === mySurname));

                        const isPlayable = (!m.winner || m.winner === "")
                            && m.teamA && m.teamB
                            && m.teamA !== 'BYE' && m.teamB !== 'BYE';

                        if (isMyMatch && isPlayable) {
                            foundAny = true;
                            renderCard(m, t.tournamentName, container);
                        }
                    });
                }
            });

            if (!foundAny) {
                alertBox.classList.remove('d-none');
                alertBox.textContent = `Nessuna partita attiva assegnata all'arbitro "${myUsername}" (o "${mySurname}").`;
            }

        } catch (error) {
            console.error(error);
            alert("Impossibile caricare le partite.");
        }
    }

    // --- 3. RENDER HTML ---
    function renderCard(match, tournamentName, container) {
        // Formattazione data dal DTO LocalDateTime
        let dateDisplay = "Data da definire";
        if (match.matchDate) {
            const d = new Date(match.matchDate);
            dateDisplay = d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        const html = `
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card shadow-sm match-card h-100">
                    <div class="card-header bg-white border-bottom-0 pt-3">
                        <small class="text-muted text-uppercase fw-bold">${tournamentName}</small>
                        <span class="float-end badge bg-light text-dark border">#${match.matchIndex}</span>
                    </div>

                    <div class="card-body text-center pt-0">
                        <div class="py-3">
                            <h4 class="mb-0 text-primary">${match.teamA}</h4>
                            <div class="my-2"><span class="vs-badge">VS</span></div>
                            <h4 class="mb-0 text-danger">${match.teamB}</h4>
                        </div>
                        <hr>
                        <div class="text-start small text-muted px-2">
                            <p class="mb-1"><i class="bi bi-geo-alt-fill"></i> Stadio: <strong>${match.stadium || 'N/D'}</strong></p>
                            <p class="mb-1"><i class="bi bi-calendar-event-fill"></i> ${dateDisplay}</p>
                            <p class="mb-0 text-success fw-bold"><i class="bi bi-person-check-fill"></i> Arbitro: ${match.referee}</p>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-top-0 pb-3">
                        <button class="btn btn-warning w-100 fw-bold shadow-sm"
                                onclick="openModal('${match.matchId}', '${match.teamA}', '${match.teamB}')">
                            ✏️ Inserisci Risultato
                        </button>
                    </div>
                </div>
            </div>
        `;
        container.innerHTML += html;
    }

    // --- 4. INVIO RISULTATO ---
    function openModal(id, teamA, teamB) {
        document.getElementById('modalMatchId').value = id;
        document.getElementById('modalNameA').value = teamA;
        document.getElementById('modalNameB').value = teamB;
        document.getElementById('btnTeamA').innerText = teamA;
        document.getElementById('btnTeamB').innerText = teamB;
        modal.show();
    }

    async function submitResult(winnerSide) {
        const matchId = document.getElementById('modalMatchId').value;
        const winnerName = winnerSide === 'A'
            ? document.getElementById('modalNameA').value
            : document.getElementById('modalNameB').value;

        if(!confirm(`Confermi la vittoria di: ${winnerName}?`)) return;

        const requestBody = { matchId: matchId, winner: winnerName };

        try {
            const res = await fetch('/api/tournaments/match/update_winner', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(requestBody)
            });

            if (res.ok) {
                alert("Risultato salvato!");
                modal.hide();
                loadMatches();
            } else {
                const txt = await res.text();
                throw new Error(txt);
            }
        } catch (e) {
            alert("Errore: " + e.message);
        }
    }
</script>

</body>
</html>
