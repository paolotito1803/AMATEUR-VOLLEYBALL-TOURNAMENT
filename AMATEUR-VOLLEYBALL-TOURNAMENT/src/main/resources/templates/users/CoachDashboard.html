<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Coach Dashboard - Volleyball Tournament</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; }
        .navbar-brand { font-size: 1.5rem; }
        .btn-icon { padding: 0.25rem 0.5rem; font-size: 0.875rem; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary mb-5 shadow-sm">
    <div class="container">
        <a href="/" class="btn btn-outline-secondary position-absolute top-0 start-0 m-3">
            <i class="bi bi-arrow-left"></i> Home
        </a>
        <a class="navbar-brand fw-bold" href="/">🏐 Volleyball Tournament</a>
        <div class="d-flex align-items-center gap-3">
            <span id="nav-user" class="text-white fw-bold"></span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="container">

    <!-- LOADING SPINNER -->
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- VIEW 1: REGISTRATION (No Team) -->
    <div id="registration-view" class="row justify-content-center d-none">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-white border-0 pt-4 pb-0">
                    <h4 class="fw-bold">Welcome Coach!</h4>
                    <p class="text-muted">You don't have a team yet. Create one now.</p>
                </div>
                <div class="card-body">
                    <form onsubmit="registerTeam(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Team Name</label>
                            <input type="text" id="regTeamName" class="form-control" placeholder="e.g. Tigers" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Register Team</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- VIEW 2: DASHBOARD (Has Team) -->
    <div id="management-view" class="d-none">

        <!-- HEADER: TEAM INFO & STADIUM -->
        <div class="card shadow mb-4 border-start border-primary border-5">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2 id="teamNameDisplay" class="text-primary fw-bold mb-0">Team Name</h2>
                        <p class="text-muted mb-0">Coach: <span id="coachNameDisplay"></span></p>

                        <div class="mt-2">
                            <i class="bi bi-geo-alt-fill text-danger me-1"></i>
                            <span class="badge bg-secondary" id="stadiumDisplay">Stadium not assigned</span>
                        </div>
                    </div>

                    <button class="btn btn-outline-primary" onclick="openStadiumModal()">
                        <i class="bi bi-pencil-square me-1"></i> Update Stadium
                    </button>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- LEFT COL: ADD PLAYER -->
            <div class="col-md-4">
                <div class="card shadow mb-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0 fw-bold">Add Player</h5>
                    </div>
                    <div class="card-body">
                        <form onsubmit="addPlayer(event)">
                            <div class="mb-2">
                                <label class="form-label">Name</label>
                                <input type="text" id="pName" class="form-control" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Number</label>
                                <input type="number" id="pNum" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Role</label>
                                <select id="pRole" class="form-select" required>
                                    <option value="PLAYER">Spiker (Player)</option>
                                    <option value="SETTER">Setter (Setter)</option>
                                    <option value="LIBERO">Libero</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold">Save Player</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- RIGHT COL: ROSTER TABLE -->
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-white">
                        <h5 class="mb-0 fw-bold">Roster</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="table-light">
                                <tr>
                                    <th class="ps-3">#</th>
                                    <th>Name</th>
                                    <th>Role</th>
                                    <th class="text-end pe-3" style="width: 140px;">Actions</th>
                                </tr>
                                </thead>
                                <tbody id="players-table-body">
                                <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                        <div id="empty-roster-msg" class="text-center p-4 text-muted d-none">
                            No players in roster.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: STADIUM -->
<div class="modal fade" id="stadiumModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Stadium Management</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form onsubmit="updateStadium(event)">
                    <div class="mb-3">
                        <label class="form-label">Stadium Name</label>
                        <input type="text" id="sName" class="form-control" required placeholder="e.g. PalaVolley">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Available Seats</label>
                        <input type="number" id="sSeats" class="form-control" required min="10" placeholder="e.g. 500">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: EDIT PLAYER -->
<div class="modal fade" id="editPlayerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Edit Player</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form onsubmit="submitEditPlayer(event)">
                    <input type="hidden" id="editOriginalNum"> <!-- Track original ID/Number -->

                    <div class="mb-3">
                        <label class="form-label fw-bold">Name</label>
                        <input type="text" id="editPName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Number</label>
                        <input type="number" id="editPNum" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Role</label>
                        <select id="editPRole" class="form-select" required>
                            <option value="PLAYER">Spiker (Player)</option>
                            <option value="SETTER">Setter (Setter)</option>
                            <option value="LIBERO">Libero</option>
                        </select>
                    </div>
                    <div class="modal-footer px-0 pb-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const token = localStorage.getItem('jwt_token');
    const user = JSON.parse(localStorage.getItem('user_info') || '{}');

    // Modals
    const stadiumModal = new bootstrap.Modal(document.getElementById('stadiumModal'));
    const editPlayerModal = new bootstrap.Modal(document.getElementById('editPlayerModal'));

    // --- INIT ---
    document.addEventListener('DOMContentLoaded', () => {
        if (!token || user.role !== 'COACH') {
            window.location.href = '/users/login';
            return;
        }
        document.getElementById('nav-user').textContent = user.username;
        loadTeamData();
    });

    // --- LOAD DATA ---
    async function loadTeamData() {
        try {
            const res = await fetch('/api/teams', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            document.getElementById('loading').classList.add('d-none');

            if (res.ok) {
                const allTeams = await res.json();
                const myTeam = allTeams.find(t => t.coachId === user.id);

                if (myTeam) {
                    renderDashboard(myTeam);
                } else {
                    document.getElementById('registration-view').classList.remove('d-none');
                }
            } else {
                console.error("Error fetching team");
            }
        } catch (e) {
            console.error(e);
            alert("Connection Error.");
        }
    }

    // --- RENDER DASHBOARD ---
    function renderDashboard(team) {
        document.getElementById('registration-view').classList.add('d-none');
        document.getElementById('management-view').classList.remove('d-none');

        document.getElementById('teamNameDisplay').textContent = team.name;
        document.getElementById('coachNameDisplay').textContent = team.coachName;

        // Stadium
        if (team.stadium) {
            document.getElementById('stadiumDisplay').textContent =
                `${team.stadium.name} (${team.stadium.maxSeats} seats)`;
            document.getElementById('sName').value = team.stadium.name;
            document.getElementById('sSeats').value = team.stadium.maxSeats;
        }

        // Roster
        const tbody = document.getElementById('players-table-body');
        tbody.innerHTML = '';

        if (!team.players || team.players.length === 0) {
            document.getElementById('empty-roster-msg').classList.remove('d-none');
        } else {
            document.getElementById('empty-roster-msg').classList.add('d-none');

            team.players.sort((a,b) => a.number - b.number).forEach(p => {
                // Escape single quotes for inline JS
                const safeName = p.name.replace(/'/g, "\\'");

                const row = `
                    <tr>
                        <td class="ps-3 fw-bold">${p.number}</td>
                        <td>${p.name}</td>
                        <td><span class="badge bg-info text-dark">${p.role}</span></td>
                        <td class="text-end pe-3">
                            <button class="btn btn-sm btn-outline-primary me-2 btn-icon"
                                onclick="openEditPlayerModal('${safeName}', ${p.number}, '${p.role}')">
                                <i class="bi bi-pencil"></i> Edit
                            </button>
                            <button class="btn btn-sm btn-outline-danger btn-icon"
                                onclick="deletePlayer(${p.number})">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    </tr>`;
                tbody.innerHTML += row;
            });
        }
    }

    // --- ACTIONS ---

    // 1. Register Team
    async function registerTeam(e) {
        e.preventDefault();
        const body = {
            coachId: user.id,
            coachName: user.username + " " + user.surname,
            teamName: document.getElementById('regTeamName').value
        };

        const res = await fetch('/api/teams/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify(body)
        });
        if (res.ok) location.reload();
        else alert("Error: Could not create team (Name might be taken).");
    }

    // 2. Add Player
    async function addPlayer(e) {
        e.preventDefault();
        const playerDto = {
            name: document.getElementById('pName').value,
            number: parseInt(document.getElementById('pNum').value),
            role: document.getElementById('pRole').value
        };

        const res = await fetch(`/api/teams/${user.id}/players`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify(playerDto)
        });

        if (res.ok) {
            // Clear inputs and reload
            document.getElementById('pName').value = '';
            document.getElementById('pNum').value = '';
            location.reload();
        } else {
            const txt = await res.text();
            alert("Error: " + txt);
        }
    }

    // 3. Update Stadium
    function openStadiumModal() {
        stadiumModal.show();
    }

    async function updateStadium(e) {
        e.preventDefault();
        const body = {
            coachId: user.id,
            stadium: {
                name: document.getElementById('sName').value,
                maxSeats: parseInt(document.getElementById('sSeats').value)
            }
        };

        const res = await fetch('/api/teams/update_stadium', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify(body)
        });

        if (res.ok) location.reload();
        else alert("Error updating stadium.");
    }

    // 4. Delete Player
    async function deletePlayer(number) {
        if(!confirm("Are you sure you want to delete player #" + number + "?")) return;

        try {
            const res = await fetch(`/api/teams/${user.id}/players/${number}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) location.reload();
            else alert("Error deleting player: " + await res.text());
        } catch (e) {
            alert("Connection error");
        }
    }

    // 5. Edit Player
    function openEditPlayerModal(name, number, role) {
        document.getElementById('editOriginalNum').value = number;
        document.getElementById('editPName').value = name;
        document.getElementById('editPNum').value = number;
        document.getElementById('editPRole').value = role;
        editPlayerModal.show();
    }

    async function submitEditPlayer(e) {
        e.preventDefault();
        const originalNum = document.getElementById('editOriginalNum').value;
        const body = {
            name: document.getElementById('editPName').value,
            number: parseInt(document.getElementById('editPNum').value),
            role: document.getElementById('editPRole').value
        };

        try {
            const res = await fetch(`/api/teams/${user.id}/players/${originalNum}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(body)
            });

            if (res.ok) location.reload();
            else alert("Error updating player: " + await res.text());
        } catch (e) {
            alert("Connection error");
        }
    }

    function logout() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_info');
        window.location.href = '/users/login';
    }
</script>

</body>
</html>
