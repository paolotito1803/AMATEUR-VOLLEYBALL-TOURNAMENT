<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Volleyball Tournament</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-4">Login</h3>

    <div id="error-msg" class="alert alert-danger d-none"></div>

    <form onsubmit="handleLogin(event)">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required value="mario@mail.com">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required value="pwd">
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>

    <div class="mt-3 text-center">
        <a href="/users/registration">Create an account</a>
    </div>
</div>

<script>
    async function handleLogin(event) {
        event.preventDefault(); // Evita il refresh della pagina standard

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorDiv = document.getElementById("error-msg");

        try {
            // Chiamata all'API che hai creato
            const response = await fetch('/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });

            if (response.ok) {
                const data = await response.json();

                // SALVA IL TOKEN E L'UTENTE NEL BROWSER
                localStorage.setItem('jwt_token', data.token);
                localStorage.setItem('user_info', JSON.stringify(data.user));

                // Reindirizza alla dashboard
                window.location.href = '/users/manager';
            } else {
                errorDiv.textContent = "Invalid credentials!";
                errorDiv.classList.remove("d-none");
            }
        } catch (error) {
            errorDiv.textContent = "Server error. Try again.";
            errorDiv.classList.remove("d-none");
        }
    }
</script>

</body>
</html>
