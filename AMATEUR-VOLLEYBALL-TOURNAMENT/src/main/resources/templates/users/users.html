<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">Volleyball Users Dev Tools</h2>
        </div>
        <div class="card-body">

            <!-- DEV BUTTONS -->
            <div class="row text-center mb-4">
                <div class="col-md-6">
                    <!-- Nota: Se hai messo la security, assicurati che /seed sia pubblico -->
                    <button onclick="callApi('/api/users/seed', 'POST')" class="btn btn-success btn-lg w-100">
                        Seed Users Data
                    </button>
                    <small class="text-muted">Creates sample coaches, referees, viewers</small>
                </div>
                <div class="col-md-6">
                    <!-- Nota: Se hai messo la security, assicurati che /reset sia pubblico -->
                    <button onclick="callApi('/api/users/reset', 'DELETE')" class="btn btn-danger btn-lg w-100">
                        Reset Users
                    </button>
                    <small class="text-muted">Deletes ALL users (Soft Delete)</small>
                </div>
            </div>

            <hr>

            <!-- USERS LIST -->
            <h4>Current Users (Active Only):</h4>

            <div th:if="${users.empty}" class="alert alert-warning">
                No active users in the database.
            </div>

            <div class="table-responsive" th:unless="${users.empty}">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                    <tr>
                        <th>Username</th>
                        <th>Surname</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.username()}">Username</td>
                        <td th:text="${user.surname()}">Surname</td>
                        <td th:text="${user.email()}">Email</td>
                        <td th:text="${user.role()}">Role</td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<!-- JAVASCRIPT: Invariato -->
<script>
    function callApi(url, method) {
        const btns = document.querySelectorAll("button");
        btns.forEach(b => b.disabled = true);

        fetch(url, { method: method })
            .then(response => {
                if (response.ok) {
                    window.location.reload();
                } else {
                    return response.text().then(text => { throw new Error(text) });
                }
            })
            .catch(error => {
                alert("Error: " + error.message);
                btns.forEach(b => b.disabled = false);
            });
    }
</script>

</body>
