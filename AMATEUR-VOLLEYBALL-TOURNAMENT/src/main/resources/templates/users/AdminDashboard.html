<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
        <a href="/" class="btn btn-outline-secondary position-absolute top-0 start-0 m-3">
            <i class="bi bi-arrow-left"></i> Home
        </a>
        <a class="navbar-brand" href="#">🏐 Admin Dashboard</a>
        <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Gestione Tornei</h4>
                </div>
                <div class="card-body">

                    <h5 class="card-title">Crea Nuovo Torneo</h5>
                    <p class="text-muted">Seleziona le squadre esistenti per generare il tabellone.</p>

                    <!-- FORM -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nome del Torneo</label>
                        <input type="text" id="tName" class="form-control" placeholder="Es. Winter Cup 2024">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Seleziona Squadre (Min 2)</label>
                        <div class="card p-3 bg-light" style="max-height: 300px; overflow-y: auto;">

                            <!-- CHECKBOX GENERATE DA THYMELEAF -->
                            <div th:each="team : ${allTeams}" class="form-check mb-2">
                                <input class="form-check-input team-checkbox"
                                       type="checkbox"
                                       th:value="${team.name}"
                                       th:id="'team-' + ${team.id}">
                                <label class="form-check-label"
                                       th:for="'team-' + ${team.id}">
                                    <span th:text="${team.name}">Nome Squadra</span>
                                    <small class="text-muted ms-2" th:text="'(Coach: ' + ${team.coachName} + ')'"></small>
                                </label>
                            </div>

                            <div th:if="${allTeams.isEmpty()}" class="text-danger small text-center mt-2">
                                Nessuna squadra trovata.
                            </div>
                        </div>
                        <small class="text-muted" id="teamCount">0 selezionate</small>
                    </div>

                    <div class="d-grid">
                        <button onclick="createTournament()" class="btn btn-success btn-lg">Genera Torneo</button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function logout() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_info');
        window.location.href = '/users/login';
    }

    document.querySelectorAll('.team-checkbox').forEach(cb => {
        cb.addEventListener('change', () => {
            const count = document.querySelectorAll('.team-checkbox:checked').length;
            document.getElementById('teamCount').innerText = count + " selezionate";
        });
    });

    function createTournament() {
        const name = document.getElementById("tName").value;
        const checkboxes = document.querySelectorAll('.team-checkbox:checked');
        const teamsList = Array.from(checkboxes).map(cb => cb.value);

        if (!name) { alert("Inserisci il nome!"); return; }
        if (teamsList.length < 2) { alert("Seleziona almeno 2 squadre!"); return; }

        const requestBody = { tournamentName: name, teams: teamsList };
        const token = localStorage.getItem('jwt_token');
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;

        fetch('/api/tournaments/create_tournament', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(requestBody)
        })
            .then(response => {
                if (response.ok) {
                    alert("Torneo creato!");
                    location.reload();
                } else {
                    return response.text().then(text => { throw new Error(text) });
                }
            })
            .catch(error => alert("Errore: " + error.message));
    }
</script>

</body>
</html>
