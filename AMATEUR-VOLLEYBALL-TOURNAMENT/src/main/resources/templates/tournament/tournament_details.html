<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Referee Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a href="/tournament/admin_dashboard" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left"></i> Back
        </a>
        <span class="navbar-text text-white fw-bold fs-5" th:text="${tournament.tournamentName}">Tournament Name</span>
        <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
    </div>
</nav>

<div class="container">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0"><i class="bi bi-whistle"></i> Match-Referee</h5>
        </div>
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle border">
                    <thead class="table-light">
                    <tr>
                        <th>Match #</th>
                        <th>Team A</th>
                        <th>Team B</th>
                        <th>Stadium</th>
                        <th style="width: 30%;">Referee Assignment</th>
                        <th>Save</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="match : ${tournament.matches}">
                        <td><span class="badge bg-secondary" th:text="${match.matchIndex}">1</span></td>

                        <td class="fw-bold text-primary" th:text="${match.teamA != null && match.teamA != '' ? match.teamA : 'TBD'}">A</td>
                        <td class="fw-bold text-danger" th:text="${match.teamB != null && match.teamB != '' ? match.teamB : 'TBD'}">B</td>

                        <td th:text="${match.stadium != null && match.stadium != '' ? match.stadium : '-'}">Stadio</td>

                        <!-- TENDINA ARBITRI -->
                        <td>
                            <select class="form-select form-select-sm" th:id="'ref-' + ${match.matchId}">
                                <option value="" th:selected="${match.referee == null || match.referee == ''}">-- Seleziona --</option>

                                <!-- Popolato da UsersService -->
                                <option th:each="ref : ${referees}"
                                        th:value="${ref.username}"
                                        th:text="${ref.surname} + ' ' + ${ref.username}"
                                        th:selected="${match.referee == ref.username}">
                                    Rossi Mario
                                </option>
                            </select>
                        </td>

                        <!-- BOTTONE SALVA (CORRETTO) -->
                        <td>
                            <!--
                                FIX APPLICATO:
                                1. Usiamo th:data-match-id per iniettare l'ID in modo sicuro.
                                2. Usiamo onclick standard per leggere quell'attributo.
                            -->
                            <button class="btn btn-success btn-sm"
                                    th:data-match-id="${match.matchId}"
                                    onclick="saveReferee(this.getAttribute('data-match-id'))">
                                <i class="bi bi-save"></i>
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script>
    function logout() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_info');
        window.location.href = '/users/login';
    }

    function saveReferee(matchId) {
        const selectBox = document.getElementById('ref-' + matchId);
        const newRef = selectBox.value;

        if (!newRef) {
            if(!confirm("Stai rimuovendo l'arbitro da questo match. Continuare?")) return;
        }

        const body = {
            matchId: matchId,
            newReferee: newRef
        };

        const token = localStorage.getItem('jwt_token');
        const headers = { 'Content-Type': 'application/json' };
        if(token) headers['Authorization'] = 'Bearer ' + token;

        // Endpoint per aggiornare l'arbitro
        fetch('/api/tournaments/match/update_referee', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(body)
        })
            .then(res => {
                if(res.ok) {
                    // Feedback visivo (Selettore aggiornato per usare data-match-id)
                    const btn = document.querySelector(`button[data-match-id='${matchId}']`);
                    if(btn) {
                        const originalHtml = btn.innerHTML;
                        btn.innerHTML = '<i class="bi bi-check-circle-fill"></i> OK';
                        btn.classList.remove('btn-success');
                        btn.classList.add('btn-dark');
                        setTimeout(() => {
                            btn.innerHTML = originalHtml;
                            btn.classList.add('btn-success');
                            btn.classList.remove('btn-dark');
                        }, 2000);
                    } else {
                        alert("Arbitro assegnato con successo!");
                    }
                } else {
                    res.text().then(t => alert("Errore: " + t));
                }
            })
            .catch(e => alert("Errore connessione: " + e));
    }
</script>

</body>
</html>
