<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Match Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a href="/tournament/admin_dashboard" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
        <span class="navbar-text text-white fw-bold fs-5" th:text="${tournament.tournamentName}">Tournament Name</span>
        <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0"><i class="bi bi-gear-fill"></i> Match Management & Assignment</h5>
        </div>
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle border">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 5%">#</th>
                        <th style="width: 15%">Team A</th>
                        <th style="width: 15%">Team B</th>
                        <th style="width: 20%">Date & Time</th>
                        <th style="width: 20%">Stadium</th>
                        <th style="width: 20%">Referee</th>
                        <th style="width: 5%">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="match : ${tournament.matches}">
                        <!-- Match Index -->
                        <td><span class="badge bg-secondary" th:text="${match.matchIndex}">1</span></td>

                        <!-- Teams -->
                        <td class="fw-bold text-primary" th:text="${match.teamA != null && match.teamA != '' ? match.teamA : 'TBD'}">A</td>
                        <td class="fw-bold text-danger" th:text="${match.teamB != null && match.teamB != '' ? match.teamB : 'TBD'}">B</td>

                        <!-- DATE INPUT -->
                        <td>
                            <input type="datetime-local" class="form-control form-control-sm"
                                   th:id="'date-' + ${match.matchId}"
                                   th:value="${match.matchDate}">
                        </td>

                        <!-- STADIUM SELECT -->
                        <td>
                            <select class="form-select form-select-sm" th:id="'stadium-' + ${match.matchId}">
                                <option value="" th:selected="${match.stadium == null || match.stadium == ''}">-- Select Stadium --</option>

                                <!--  -->
                                <option th:each="std : ${stadiums}"
                                        th:value="${std}"
                                        th:text="${std}"
                                        th:selected="${match.stadium == std}">
                                    PalaVolley
                                </option>
                            </select>
                        </td>

                        <!-- REFEREE SELECT -->
                        <td>
                            <select class="form-select form-select-sm" th:id="'ref-' + ${match.matchId}">
                                <option value="" th:selected="${match.referee == null || match.referee == ''}">-- None --</option>

                                <!-- List populated by UsersService -->
                                <option th:each="ref : ${referees}"
                                        th:value="${ref.username}"
                                        th:text="${ref.surname} + ' ' + ${ref.username}"
                                        th:selected="${match.referee == ref.username}">
                                    Doe John
                                </option>
                            </select>
                        </td>

                        <!-- SAVE BUTTON -->
                        <td>
                            <button class="btn btn-success btn-sm w-100"
                                    th:data-match-id="${match.matchId}"
                                    onclick="saveMatchDetails(this.getAttribute('data-match-id'))">
                                <i class="bi bi-save"></i> Save
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script>
    function logout() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_info');
        window.location.href = '/users/login';
    }

    async function saveMatchDetails(matchId) {
        const token = localStorage.getItem('jwt_token');
        const headers = { 'Content-Type': 'application/json' };
        if(token) headers['Authorization'] = 'Bearer ' + token;

        // 1. Find Elements from DOM
        const refSelect = document.getElementById('ref-' + matchId);
        const stadiumInput = document.getElementById('stadium-' + matchId);
        const dateInput = document.getElementById('date-' + matchId);

        // 2. Read value
        const referee = refSelect ? refSelect.value : "";
        const stadium = stadiumInput ? stadiumInput.value : "";
        const date = dateInput ? dateInput.value : "";


        console.log(`Saving Match ${matchId}: Ref='${referee}', Stadium='${stadium}', Date='${date}'`);

        // Security Check
        if (referee === "") {
            if(!confirm("ATTENTION: you are saving a match without referee, are you sure?")) return;
        }

        const requests = [];

        // A. Update Referee
        const bodyRef = { matchId: matchId, newReferee: referee };
        requests.push(fetch('/api/tournaments/match/update_referee', {
            method: 'POST', headers: headers, body: JSON.stringify(bodyRef)
        }));

        // B. Update Stadium
        if (stadium) {
            const bodyStadium = { matchId: matchId, newStadium: stadium };

            requests.push(fetch('/api/tournaments/match/update_stadium', {
                method: 'POST', headers: headers, body: JSON.stringify(bodyStadium)
            }));
        }

        // C. Update Date
        if (dateInput && date) {
            const bodyDate = { matchId: matchId, newDate: date };
            requests.push(fetch('/api/tournaments/match/update_date', {
                method: 'POST', headers: headers, body: JSON.stringify(bodyDate)
            }));
        }

        try {
            const responses = await Promise.all(requests);

            let hasError = false;
            for (const r of responses) {
                if (!r.ok) {
                    hasError = true;
                    const text = await r.text();
                    alert("Errore Server: " + text);
                }
            }

            if (!hasError) {
                // Feedback Visivo
                const btn = document.querySelector(`button[data-match-id='${matchId}']`);
                if(btn) {
                    btn.classList.remove('btn-success');
                    btn.classList.add('btn-dark');
                    btn.innerHTML = '<i class="bi bi-check-lg"></i> Saved';
                    setTimeout(() => {
                        btn.classList.add('btn-success');
                        btn.classList.remove('btn-dark');
                        btn.innerHTML = '<i class="bi bi-save"></i> Save';
                    }, 2000);
                }
            }
        } catch (e) {
            alert("Connection Error: " + e);
        }
    }
</script>

</body>
</html>
