<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tournament Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light container mt-5">

<div class="card shadow mb-4">
    <div class="card-header bg-primary text-white">Create Tournament</div>
    <div class="card-body">
        <div class="mb-3">
            <label>Tournament Name</label>
            <input type="text" id="tName" class="form-control" value="Winter Cup">
        </div>

        <div class="mb-3">
            <label class="form-label">Select Teams (Min 2)</label>
            <div class="card p-3" style="max-height: 200px; overflow-y: auto;">
                <!-- Loop through the actual teams from the DB -->
                <div th:each="team : ${allTeams}" class="form-check">
                    <input class="form-check-input team-checkbox"
                           type="checkbox"
                           th:value="${team.name}"
                           th:id="'team-' + ${team.id}">
                    <label class="form-check-label"
                           th:for="'team-' + ${team.id}"
                           th:text="${team.name}">
                        Team Name
                    </label>
                </div>

                <!-- Show warning if no teams exist -->
                <div th:if="${allTeams.isEmpty()}" class="text-danger small">
                    No teams found! Go to <a href="/teams/manager">Teams Manager</a> to create some.
                </div>
            </div>
            <small class="text-muted" id="teamCount">0 selected</small>
        </div>
        <!--
        <div class="mb-3">
            <label>Teams (comma separated)</label>
            <textarea id="tTeams" class="form-control" rows="3">Alpha,Beta,Gamma,Delta,Epsilon,Zeta,Eta</textarea>
            <small class="text-muted">Enter 7 teams to test the automatic 8-slot expansion.</small>
        </div>
        -->
        <button onclick="createTournament()" class="btn btn-success">Create & Generate Bracket</button>
    </div>
</div>

<h3>Active Tournaments</h3>
<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${tournaments}">
        <td th:text="${t.id}">ID</td>
        <td th:text="${t.tournamentName}">Name</td>
        <td>
            <a th:href="@{/tournament/{id}/bracket(id=${t.id})}" class="btn btn-primary btn-sm">View Bracket</a>

            <button class="btn btn-danger btn-sm ms-2"
                    th:data-id="${t.id}"
                    onclick="deleteTournament(this.getAttribute('data-id'))">
                Delete
            </button>
        </td>
    </tr>
    </tbody>
</table>

<script>
    function createTournament() {
        const name = document.getElementById("tName").value;

        // 1. Collect all checked boxes
        const checkboxes = document.querySelectorAll('.team-checkbox:checked');
        const teamsList = Array.from(checkboxes).map(cb => cb.value);

        // 2. Simple Validation
        if (teamsList.length < 2) {
            alert("Please select at least 2 teams!");
            return;
        }

        const requestBody = {
            tournamentName: name,
            teams: teamsList
        };

        fetch('/api/tournaments/create_tournament', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
        })
            .then(response => {
                if (response.ok) location.reload();
                else response.text().then(alert);
            });
    }

    // Update counter when clicking
    document.querySelectorAll('.team-checkbox').forEach(cb => {
        cb.addEventListener('change', () => {
            const count = document.querySelectorAll('.team-checkbox:checked').length;
            document.getElementById('teamCount').innerText = count + " selected";
        });
    });

    function deleteTournament(id) {
        if (!confirm("Are you sure you want to delete this tournament? All matches will be lost.")) {
            return;
        }

        fetch('/api/tournaments/delete/' + id, {
            method: 'DELETE'
        })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    return response.text().then(text => { throw new Error(text) });
                }
            })
            .catch(error => alert("Error: " + error.message));
    }
</script>
</body>
</html>
